<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQLite-Übungen</title>

  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/eclipse.min.css">

  <style>
    body {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      color: #1f2937;
    }

    h1 { margin-bottom: 0.2rem; }
    
    /* CodeMirror anpassen */
    .CodeMirror {
      min-height: 230px;
      font-size: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }

    button {
      margin: 0.2rem 0.8rem 0.2rem 0;
      padding: 0.6rem 1rem;
      border: 0;
      border-radius: 6px;
      color: white;
      background: #2563eb;
      cursor: pointer;
      font-size: 1rem;
    }
    
    #tabellen-info {
    display: none;
    }

    button.secondary { background: #4b5563; }

    #meldung {
      padding: 0.8rem;
      background: #f3f4f6;
      border-radius: 6px;
      white-space: pre-wrap;
    }

    table {
      width: 100%;
      margin-top: 1rem;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.55rem;
      text-align: left;
      border: 1px solid #d1d5db;
    }

    th { background: #e5e7eb; }

    code {
      background: #f3f4f6;
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <h1>SQLite-Übungen</h1>

  <h2>Datenbanktabellen</h2>
  <p>
   pokemon (bild, <u>id</u>, name, typ1, typ2, groesse, gewicht, species, beschreibung)
  </p>

  <div id="tabellen-info"></div>
  
  <textarea id="sql" rows="12" placeholder="SELECT *&#10;FROM schueler"></textarea>

  <div style="margin-top: 0.4rem; display: flex; align-items: center;">
    <button id="ausfuehren">Abfrage ausführen</button>

    <div style="margin-left: auto; display: flex; align-items: center; gap: 0.4rem;">
      <button id="zoom-minus" class="secondary" style="padding: 0.3rem 0.5rem; font-size: 1.1rem;" title="Schrift verkleinern">−</button>
      <button id="zoom-plus" class="secondary" style="padding: 0.3rem 0.5rem; font-size: 1.1rem;" title="Schrift vergrößern">+</button>
    </div>
  </div>

  <div id="meldung">Datenbank wird geladen …</div>
  <div id="ergebnis"></div>

  <!-- sql.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  
  <!-- CodeMirror -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/sql/sql.min.js"></script>

  <script>
  let db;
  let SQL;
  let editor; // CodeMirror-Instanz

  const datenbanken = [
    "datenbanken/schule.db",
    "datenbanken/pokedex.db",
  ];

  async function starteSqlJs() {
    SQL = await initSqlJs({
      locateFile: file =>
        `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
    });

    db = new SQL.Database();

    await ladeAlleDatenbanken();
    zeigeTabellen();
    
    // CodeMirror initialisieren NACHDEM sql.js geladen ist
    initialisiereEditor();
  }

  function initialisiereEditor() {
    const textarea = document.getElementById("sql");
    
    editor = CodeMirror.fromTextArea(textarea, {
      mode: "text/x-sql",
      theme: "eclipse",
      lineNumbers: true,
      lineWrapping: true,
      tabSize: 2,
      indentUnit: 2
    });
  }

  async function ladeAlleDatenbanken() {
    const meldung = document.getElementById("meldung");
    const ausgabe = document.getElementById("ergebnis");

    meldung.textContent = "Übungsdatenbanken werden geladen …";
    ausgabe.innerHTML = "";

    let geladeneDateien = 0;

    for (const pfad of datenbanken) {
      try {
        const antwort = await fetch(pfad);

        if (!antwort.ok) {
          throw new Error(`Datei nicht gefunden (${antwort.status})`);
        }

        const daten = await antwort.arrayBuffer();
        const quellDb = new SQL.Database(new Uint8Array(daten));

        kopiereTabellen(quellDb, pfad);
        quellDb.close();

        geladeneDateien++;

      } catch (fehler) {
        console.error(`Fehler beim Laden von ${pfad}:`, fehler);
      }
    }

    meldung.textContent =
      `${geladeneDateien} von ${datenbanken.length} Datenbankdatei(en) geladen.`;
  }

  function kopiereTabellen(quellDb, dateiname) {
    const result = quellDb.exec(`
      SELECT name, sql
      FROM sqlite_master
      WHERE type = 'table'
        AND name NOT LIKE 'sqlite_%'
      ORDER BY name;
    `);

    if (result.length === 0) return;

    for (const [tabellenName, createSql] of result[0].values) {
      const existiertSchon = db.exec(`
        SELECT name
        FROM sqlite_master
        WHERE type = 'table'
          AND name = '${tabellenName.replaceAll("'", "''")}';
      `);

      if (existiertSchon.length > 0) {
        console.warn(
          `Tabelle "${tabellenName}" aus ${dateiname} wurde übersprungen, ` +
          "weil bereits eine Tabelle mit diesem Namen existiert."
        );
        continue;
      }

      db.run(createSql);

      const daten = quellDb.exec(`SELECT * FROM "${tabellenName.replaceAll('"', '""')}";`);

      if (daten.length === 0 || daten[0].values.length === 0) {
        continue;
      }

      const spalten = daten[0].columns;
      const platzhalter = spalten.map(() => "?").join(", ");
      const spaltenSql = spalten
        .map(spalte => `"${spalte.replaceAll('"', '""')}"`)
        .join(", ");

      const einfuegen = db.prepare(`
        INSERT INTO "${tabellenName.replaceAll('"', '""')}"
        (${spaltenSql})
        VALUES (${platzhalter});
      `);

      for (const zeile of daten[0].values) {
        einfuegen.run(zeile);
      }

      einfuegen.free();
    }
  }

  function zeigeTabellen() {
    const info = document.getElementById("tabellen-info");

    const result = db.exec(`
      SELECT name
      FROM sqlite_master
      WHERE type = 'table'
        AND name NOT LIKE 'sqlite_%'
      ORDER BY name;
    `);

    const tabellen = result.length > 0
      ? result[0].values.map(zeile => zeile[0])
      : [];

    info.textContent = tabellen.length > 0
      ? "Verfügbare Tabellen: " + tabellen.join(", ")
      : "Es wurden keine Tabellen geladen.";
  }

  function zeigeAbfrage() {
    // SQL aus CodeMirror holen (nicht direkt aus textarea)
    const sql = editor.getValue().trim();
    const ausgabe = document.getElementById("ergebnis");
    const meldung = document.getElementById("meldung");

    if (!db) {
      meldung.textContent = "Datenbanken werden noch geladen.";
      return;
    }

    if (!sql) {
      meldung.textContent = "Bitte gib eine SQL-Abfrage ein.";
      return;
    }

    try {
      const resultate = db.exec(sql);

      if (resultate.length === 0) {
        ausgabe.innerHTML = "";
        meldung.textContent = "SQL-Befehl erfolgreich ausgeführt.";
        zeigeTabellen();
        return;
      }

      const ergebnis = resultate[0];
      let html = "<table><thead><tr>";

      for (const spalte of ergebnis.columns) {
        html += `<th>${escapeHtml(spalte)}</th>`;
      }

      html += "</tr></thead><tbody>";

      for (const zeile of ergebnis.values) {
        html += "<tr>";

        for (let i = 0; i < zeile.length; i++) {
          const spalte = ergebnis.columns[i];
          const wert = zeile[i];

          if (spalte === "bild") {
            const url = String(wert ?? "").trim();

            if (url.startsWith("https://")) {
              html += `
                <td>
                  <img
                    src="${escapeHtml(url)}"
                    alt="Bild"
                    width="68"
                    height="68"
                    loading="lazy"
                    referrerpolicy="no-referrer"
                  >
                </td>
              `;
            } else {
              html += "<td>Kein gültiger Bildlink</td>";
            }

          } else {
            html += `<td>${escapeHtml(wert ?? "")}</td>`;
          }
        }

        html += "</tr>";
      }

      html += "</tbody></table>";

      ausgabe.innerHTML = html;
      meldung.textContent = `${ergebnis.values.length} Zeile(n) gefunden.`;

    } catch (fehler) {
      ausgabe.innerHTML = "";
      meldung.textContent = "SQL-Fehler: " + fehler.message;
    }
  }

  function escapeHtml(wert) {
    return String(wert)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  let editorFontSize = 18; // Startgröße in px

function setEditorFontSize(size) {
  editorFontSize = size;
  const dom = document.querySelector(".CodeMirror");
  if (dom) {
    dom.style.fontSize = editorFontSize + "px";
  }
  editor.refresh();
}

document.getElementById("zoom-minus")
  .addEventListener("click", () => {
    setEditorFontSize(Math.max(10, editorFontSize - 2));
  });

document.getElementById("zoom-plus")
  .addEventListener("click", () => {
    setEditorFontSize(Math.min(32, editorFontSize + 2));
  });

// Initiale Schriftgröße setzen
setEditorFontSize(editorFontSize);

  document.getElementById("ausfuehren")
    .addEventListener("click", zeigeAbfrage);

  starteSqlJs();
  </script>
</body>
</html>
